<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUKI Laundry — Owner Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            canvas: '#D7E3E3',
            tealbrand: '#0F7D8F',
            tealdark: '#0B6270',
            aqua: '#9DD0D9',
            mutedbox: '#D3DFDF',
            ink: '#163338',
            inksoft: '#4E686D',
            borderline: '#9FC2C8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-ink min-h-screen flex font-sans">

  <!-- LEFT SIDEBAR -->
  <aside class="w-64 bg-white shrink-0 flex flex-col justify-between p-5 border-r border-mutedbox/60 min-h-screen sticky top-0 h-screen">
    <div>
      <!-- Brand -->
      <div class="flex items-center gap-2.5 px-1 mb-5">
        <div class="w-9 h-9 rounded-xl bg-tealbrand/10 border border-tealbrand/30 flex items-center justify-center text-tealbrand">
          <i data-lucide="washing-machine" class="w-5 h-5"></i>
        </div>
        <span class="text-xl font-extrabold tracking-tight text-ink">SUKI Laundry</span>
      </div>

      <!-- Cabang Aktif -->
      <div class="bg-mutedbox/75 rounded-2xl p-3.5 mb-5">
        <div class="text-[10px] font-bold uppercase tracking-wider text-inksoft">Cabang Aktif</div>
        <div class="text-sm font-bold text-ink mt-0.5">Dinoyo, Malang</div>
      </div>

      <!-- Menu Navigation -->
      <nav class="space-y-1.5">
        <button onclick="switchPage('dasbor')" data-menu="dasbor" class="menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-tealbrand text-white font-bold text-sm transition cursor-pointer">
          <i data-lucide="layout-grid" class="w-4 h-4"></i> Dasbor
        </button>
        <button onclick="switchPage('pesanan-baru')" data-menu="pesanan-baru" class="menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-ink hover:bg-canvas/50 font-semibold text-sm transition cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4"></i> Pesanan Baru
        </button>
        <button onclick="switchPage('antrean')" data-menu="antrean" class="menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-ink hover:bg-canvas/50 font-semibold text-sm transition cursor-pointer">
          <i data-lucide="columns-3" class="w-4 h-4"></i> Antrean Kerja
        </button>
        <button onclick="switchPage('verifikasi')" data-menu="verifikasi" class="menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-ink hover:bg-canvas/50 font-semibold text-sm transition cursor-pointer">
          <i data-lucide="receipt" class="w-4 h-4"></i> Semua Pesanan
        </button>
        <button onclick="switchPage('rekap')" data-menu="rekap" class="menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-ink hover:bg-canvas/50 font-semibold text-sm transition cursor-pointer">
          <i data-lucide="bar-chart-2" class="w-4 h-4"></i> Rekap Pendapatan
        </button>
      </nav>
    </div>

    <!-- Bottom Sidebar Widgets -->
    <div class="space-y-4">
      <div onclick="switchPage('verifikasi')" class="bg-aqua rounded-2xl p-4 cursor-pointer hover:brightness-95 transition">
        <i data-lucide="qr-code" class="w-5 h-5 text-ink mb-2"></i>
        <div class="text-xs font-bold text-ink">Pesanan sudah siap?</div>
        <div class="text-xs font-medium text-ink mt-1 flex items-center gap-1">
          Verifikasi pengambilan <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </div>
      </div>

      <div class="px-1 flex items-end justify-between">
        <div>
          <div class="text-[10px] font-bold uppercase tracking-wider text-inksoft">Toko Buka</div>
          <div class="text-xs font-extrabold text-ink mt-0.5">08.00–20.00 WIB</div>
          <div class="text-[11px] text-inksoft">Senin, 16 November 2026</div>
        </div>
        <button onclick="logout()" title="Keluar" class="p-2 rounded-xl text-inksoft hover:bg-canvas/70 hover:text-ink cursor-pointer">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- RIGHT CONTENT AREA -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- TOP BAR -->
    <header class="bg-white px-8 py-4 flex items-center justify-between border-b border-mutedbox/60 sticky top-0 z-10">
      <div class="relative w-96">
        <i data-lucide="search" class="w-4 h-4 text-inksoft absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input id="globalSearch" type="text" placeholder="Cari nama pelanggan atau kode pesanan"
          onkeydown="if(event.key==='Enter') searchGlobal()"
          class="w-full pl-10 pr-4 py-2 rounded-xl border border-borderline text-sm text-ink placeholder:text-inksoft focus:outline-none focus:border-tealbrand" />
      </div>
      <div class="flex items-center gap-6">
        <span class="text-xs text-inksoft font-medium">Sesi pagi · 08.00–16.00</span>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-full bg-aqua text-ink font-extrabold text-xs flex items-center justify-center">AP</div>
          <div>
            <div id="ownerName" class="text-xs font-bold text-ink">Ayu Pratiwi</div>
            <div class="text-[11px] text-inksoft">Pemilik & kasir</div>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN VIEWS CONTAINER -->
    <main id="main-content" class="p-8 space-y-6 flex-1">
      <!-- Konten halaman akan dimuat secara dinamis via router.js -->
    </main>

  </div>

  <script src="router.js"></script>
</body>
</html>
