<section id="page-rekap" class="space-y-5">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-extrabold text-ink">Rekap Pendapatan</h1>
      <p class="text-xs text-inksoft mt-0.5">Lihat pemasukan dan transaksi laundry dalam satu tempat.</p>
    </div>
    <button onclick="exportCSV()" class="px-5 py-2.5 rounded-xl bg-tealbrand hover:bg-tealdark text-white font-bold text-sm flex items-center gap-1.5 cursor-pointer">
      <i data-lucide="download" class="w-4 h-4"></i> Ekspor
    </button>
  </div>

  <div id="rekapKPI" class="grid grid-cols-3 gap-4"></div>

  <div class="bg-white rounded-3xl p-6 shadow-sm">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-base font-bold text-ink">Pendapatan per hari</h2>
      <span class="text-xs text-inksoft">Total pembayaran lunas · dalam rupiah</span>
    </div>
    <div id="rekapChart" class="grid grid-cols-7 gap-4 items-end h-36 px-2"></div>
    <div class="text-xs text-inksoft mt-4">Hari tertinggi: <strong class="text-ink">Sabtu, 14 November · Rp1.500.000</strong></div>
  </div>

  <div class="bg-white rounded-3xl p-6 shadow-sm">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-bold text-ink">Transaksi terbaru</h2>
      <span id="txCountLabel" class="text-xs text-inksoft"></span>
    </div>
    <table class="w-full text-left text-xs">
      <thead>
        <tr class="bg-mutedbox/75 text-inksoft uppercase text-[11px]">
          <th class="py-2.5 px-4 rounded-l-xl">ID Transaksi</th>
          <th class="py-2.5 px-4">Pelanggan</th>
          <th class="py-2.5 px-4">Layanan</th>
          <th class="py-2.5 px-4">Total</th>
          <th class="py-2.5 px-4 rounded-r-xl">Status</th>
        </tr>
      </thead>
      <tbody id="rekapTable" class="divide-y divide-mutedbox/40"></tbody>
    </table>
  </div>
</section>
