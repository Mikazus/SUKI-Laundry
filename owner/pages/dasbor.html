<section id="page-dasbor" class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 id="dasborGreeting" class="text-2xl font-extrabold text-ink">Selamat pagi, Bu Ayu</h1>
      <p id="dasborSubDate" class="text-xs text-inksoft mt-0.5">Ini ringkasan operasional laundry Anda hari ini.</p>
    </div>
    <button onclick="switchPage('pesanan-baru')" class="px-5 py-2.5 rounded-xl bg-tealbrand hover:bg-tealdark text-white font-bold text-sm transition cursor-pointer">
      + Pesanan Baru
    </button>
  </div>

  <!-- 4 KPI Cards -->
  <div id="kpiGrid" class="grid grid-cols-4 gap-4"></div>

  <!-- Chart + Priority -->
  <div class="grid grid-cols-3 gap-5">
    <div class="col-span-2 bg-white rounded-3xl p-6 shadow-sm">
      <div class="flex items-center gap-3 mb-6">
        <h2 class="text-base font-bold text-ink">Pendapatan mingguan</h2>
        <span id="weekRangeLabel" class="text-xs text-inksoft"></span>
      </div>
      <div id="weeklyChart" class="grid grid-cols-7 gap-3 items-end h-36 px-2"></div>
      <div class="flex items-center gap-4 mt-5 text-xs">
        <span class="font-bold text-ink">Total Rp8.050.000</span>
        <span class="text-inksoft">Rata-rata Rp1.150.000 per hari</span>
      </div>
    </div>

    <div class="bg-aqua rounded-3xl p-6 shadow-sm flex flex-col justify-between">
      <div>
        <div class="text-sm font-semibold text-ink">Prioritas hari ini</div>
        <div id="expressCountLabel" class="text-3xl font-extrabold text-ink mt-2">00 pesanan ekspres</div>
        <p class="text-xs text-ink/80 mt-2 leading-relaxed">Dahulukan pesanan ekspres agar selesai tepat waktu.</p>
      </div>
      <button onclick="switchPage('antrean')" class="w-full mt-5 py-3 rounded-xl bg-white hover:bg-white/90 text-ink font-bold text-xs flex items-center justify-center gap-1.5 transition cursor-pointer">
        Buka Antrean Kerja <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>

  <!-- Pesanan Terbaru -->
  <div class="bg-white rounded-3xl p-6 shadow-sm">
    <div class="flex items-center gap-4 mb-4">
      <h2 class="text-base font-bold text-ink">Pesanan terbaru</h2>
      <button onclick="switchPage('verifikasi')" class="text-xs font-bold text-ink hover:text-tealbrand flex items-center gap-1 cursor-pointer">
        Lihat semua pesanan <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead>
          <tr class="bg-mutedbox/75 text-inksoft uppercase text-[11px]">
            <th class="py-2.5 px-4 rounded-l-xl">Kode Pesanan</th>
            <th class="py-2.5 px-4">Pelanggan</th>
            <th class="py-2.5 px-4">Layanan</th>
            <th class="py-2.5 px-4">Total</th>
            <th class="py-2.5 px-4 rounded-r-xl">Status</th>
          </tr>
        </thead>
        <tbody id="recentOrdersTable" class="divide-y divide-mutedbox/40"></tbody>
      </table>
    </div>
  </div>
</section>
