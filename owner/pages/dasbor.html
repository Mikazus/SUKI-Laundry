<section class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-extrabold text-ink">Selamat datang, Bu Ayu</h1>
      <p class="text-xs text-inksoft mt-0.5">Ini ringkasan operasional laundry Anda hari ini.</p>
    </div>
    <button onclick="OwnerApp.navigate('pesanan-baru')" class="px-5 py-2.5 rounded-xl bg-tealbrand hover:bg-tealdark text-white font-bold text-sm transition cursor-pointer">
      + Pesanan Baru
    </button>
  </div>

  <div id="kpiGrid" class="grid grid-cols-4 gap-4"></div>

  <div class="grid grid-cols-3 gap-5">
    <div class="col-span-2 bg-white rounded-3xl p-6 shadow-sm">
      <div class="flex items-center gap-3 mb-6">
        <h2 class="text-base font-bold text-ink">Pendapatan 7 hari terakhir</h2>
        <span id="dashWeekRange" class="text-xs text-inksoft"></span>
      </div>
      <div id="weeklyChart" class="grid grid-cols-7 gap-3 items-end h-36 px-2"></div>
      <div class="flex items-center gap-4 mt-5 text-xs">
        <span id="dashWeekTotal" class="font-bold text-ink"></span>
        <span id="dashWeekAvg" class="text-inksoft"></span>
      </div>
    </div>

    <div class="bg-aqua rounded-3xl p-6 shadow-sm flex flex-col justify-between">
      <div>
        <div class="text-sm font-semibold text-ink">Prioritas hari ini</div>
        <div id="expressCountLabel" class="text-3xl font-extrabold text-ink mt-2"></div>
        <p class="text-xs text-ink/80 mt-2 leading-relaxed">Dahulukan pesanan ekspres agar selesai tepat waktu.</p>
      </div>
      <button onclick="OwnerApp.navigate('antrean')" class="w-full mt-5 py-3 rounded-xl bg-white hover:bg-white/90 text-ink font-bold text-xs flex items-center justify-center gap-1.5 transition cursor-pointer">
        Buka Antrean Kerja <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>

  <div class="bg-white rounded-3xl p-6 shadow-sm">
    <div class="flex items-center gap-4 mb-4">
      <h2 class="text-base font-bold text-ink">Pesanan terbaru</h2>
      <button onclick="OwnerApp.navigate('verifikasi')" class="text-xs font-bold text-ink hover:text-tealbrand flex items-center gap-1 cursor-pointer">
        Lihat semua pesanan <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </button>
    </div>
    <table class="w-full text-left text-xs">
      <thead>
        <tr class="bg-mutedbox/75 text-inksoft uppercase text-[11px]">
          <th class="py-2.5 px-4 rounded-l-xl">Kode Pesanan</th>
          <th class="py-2.5 px-4">Pelanggan</th>
          <th class="py-2.5 px-4">Layanan</th>
          <th class="py-2.5 px-4">Pembayaran</th>
          <th class="py-2.5 px-4">Total</th>
          <th class="py-2.5 px-4 rounded-r-xl">Status</th>
        </tr>
      </thead>
      <tbody id="recentOrdersTable" class="divide-y divide-mutedbox/40"></tbody>
    </table>
  </div>
</section>
