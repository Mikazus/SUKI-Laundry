<section id="page-verifikasi" class="space-y-5">
  <div>
    <h1 class="text-2xl font-extrabold text-ink">Verifikasi Pengambilan</h1>
    <p class="text-xs text-inksoft mt-0.5">Semua pesanan / Cocokkan nota, periksa cucian, lalu serahkan ke pelanggan.</p>
  </div>

  <div class="bg-white rounded-3xl p-4 shadow-sm flex items-center gap-3">
    <input id="verifyInput" type="text" placeholder="#SK-1411-018" value="#SK-1411-018"
      class="flex-1 px-4 py-2.5 rounded-xl border border-borderline text-sm text-ink focus:outline-none focus:border-tealbrand" />
    <button onclick="simulateQRScan()" class="px-4 py-2.5 rounded-xl border border-borderline text-xs font-bold text-ink hover:bg-canvas/50 cursor-pointer">
      Pindai kode QR
    </button>
    <button onclick="findVerifyOrder()" class="px-6 py-2.5 rounded-xl bg-tealbrand hover:bg-tealdark text-white text-xs font-bold cursor-pointer">
      Cari Pesanan
    </button>
  </div>

  <div id="verifyDetailContainer"></div>
</section>
