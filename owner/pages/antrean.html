<section id="page-antrean" class="space-y-5">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-extrabold text-ink">Antrean Kerja</h1>
      <p class="text-xs text-inksoft mt-0.5">Pantau cucian dari masuk hingga siap kembali ke pelanggan.</p>
    </div>
    <button onclick="switchPage('pesanan-baru')" class="px-5 py-2.5 rounded-xl bg-tealbrand hover:bg-tealdark text-white font-bold text-sm cursor-pointer">
      + Pesanan Baru
    </button>
  </div>

  <div class="flex items-center gap-3">
    <select id="filterPkg" onchange="renderKanban()" class="px-4 py-2 rounded-xl bg-white border border-borderline text-xs font-semibold text-ink">
      <option value="ALL">Semua layanan</option>
      <option value="Ekspres">Ekspres saja</option>
      <option value="Reguler">Reguler saja</option>
    </select>
    <div class="flex-1 bg-aqua rounded-xl px-4 py-2.5 text-xs font-semibold text-ink flex items-center gap-2">
      <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i> Pesanan Ekspres otomatis berada di urutan teratas.
    </div>
  </div>

  <!-- 4 Kanban Columns -->
  <div id="kanbanBoard" class="grid grid-cols-4 gap-4 items-start"></div>

  <!-- Status Toast -->
  <div id="statusToast" class="hidden bg-tealbrand text-white rounded-2xl px-5 py-3.5 text-sm font-bold flex items-center gap-2 shadow">
    <i data-lucide="check" class="w-4 h-4"></i> Status berhasil diperbarui
  </div>
</section>
