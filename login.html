<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — SUKI Laundry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-canvas text-ink min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-sm p-8">
    <!-- Brand -->
    <div class="flex items-center gap-3 mb-6">
      <div class="w-11 h-11 rounded-2xl bg-tealbrand/10 border border-tealbrand/30 flex items-center justify-center text-tealbrand">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="2" width="18" height="20" rx="3" />
          <circle cx="12" cy="13" r="5" />
          <path d="M8 6h.01M12 6h4" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-ink">SUKI Laundry</h1>
        <p class="text-xs text-inksoft">Cucian beres, aktivitas fokus.</p>
      </div>
    </div>

    <div class="mb-6">
      <h2 class="text-2xl font-bold text-ink">Masuk ke akun</h2>
      <p class="text-sm text-inksoft mt-1">Sistem otomatis mengenali akses Pelanggan atau Owner.</p>
    </div>

    <!-- Role Auto-Detection Indicator -->
    <div id="roleHint" class="hidden mb-4 px-3.5 py-2.5 rounded-2xl bg-aqua/70 text-ink text-xs font-semibold flex items-center justify-between">
      <span id="roleHintText">Terdeteksi sebagai: Pelanggan</span>
      <span class="px-2 py-0.5 rounded-full bg-white text-tealbrand text-[11px]">Otomatis</span>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-ink mb-1.5">Email atau Nomor WhatsApp</label>
        <input id="identifier" type="text" required placeholder="richard@student.ub.ac.id / ayu@sukilaundry.id"
          class="w-full px-4 py-3 rounded-xl border border-borderline text-sm text-ink placeholder:text-inksoft/60 focus:outline-none focus:ring-2 focus:ring-tealbrand/30 focus:border-tealbrand" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-ink mb-1.5">Kata Sandi</label>
        <input id="password" type="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl border border-borderline text-sm text-ink placeholder:text-inksoft/60 focus:outline-none focus:ring-2 focus:ring-tealbrand/30 focus:border-tealbrand" />
      </div>

      <p id="errorMsg" class="hidden text-xs font-medium text-red-700 bg-red-50 border border-red-200 px-3 py-2 rounded-xl"></p>

      <button type="submit"
        class="w-full py-3.5 rounded-xl bg-tealbrand hover:bg-tealdark text-white font-semibold text-sm transition cursor-pointer">
        Masuk Sekarang
      </button>
    </form>

    <!-- Demo Quick Fill -->
    <div class="mt-6 pt-5 border-t border-mutedbox">
      <p class="text-xs font-semibold text-inksoft mb-2.5">Coba cepat akun demo:</p>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" onclick="fillDemo('pelanggan')"
          class="px-3 py-2.5 rounded-xl bg-canvas/70 hover:bg-aqua/60 text-left transition cursor-pointer">
          <div class="text-xs font-bold text-ink">Pelanggan</div>
          <div class="text-[11px] text-inksoft">Mobile View · Richard</div>
        </button>
        <button type="button" onclick="fillDemo('owner')"
          class="px-3 py-2.5 rounded-xl bg-canvas/70 hover:bg-aqua/60 text-left transition cursor-pointer">
          <div class="text-xs font-bold text-ink">Owner / Kasir</div>
          <div class="text-[11px] text-inksoft">Desktop View · Bu Ayu</div>
        </button>
      </div>
    </div>
  </div>

  <script src="/shared/api.js"></script>
  <script>
    const idInput = document.getElementById('identifier');
    const pwInput = document.getElementById('password');
    const roleHint = document.getElementById('roleHint');
    const roleHintText = document.getElementById('roleHintText');
    const errorMsg = document.getElementById('errorMsg');

    function updateRoleHint(val) {
      const v = val.toLowerCase();
      if (v.includes('sukilaundry') || v.includes('ayu') || v.includes('owner')) {
        roleHint.classList.remove('hidden');
        roleHintText.textContent = 'Akses terdeteksi: Owner (Desktop View)';
      } else if (v.includes('@') || v.replace(/\s+/g, '').length >= 10) {
        roleHint.classList.remove('hidden');
        roleHintText.textContent = 'Akses terdeteksi: Pelanggan (Mobile View)';
      } else {
        roleHint.classList.add('hidden');
      }
    }

    idInput.addEventListener('input', (e) => updateRoleHint(e.target.value));

    function fillDemo(type) {
      if (type === 'pelanggan') {
        idInput.value = 'richard@student.ub.ac.id';
        pwInput.value = '123';
      } else {
        idInput.value = 'ayu@sukilaundry.id';
        pwInput.value = 'admin';
      }
      updateRoleHint(idInput.value);
    }

    const submitBtn = document.querySelector('#loginForm button[type="submit"]');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      if (!window.SukiAPI) {
        errorMsg.textContent = 'File /shared/api.js gagal dimuat. Cek lokasi folder shared/.';
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';
      try {
        const data = await SukiAPI.login(idInput.value, pwInput.value);
        localStorage.setItem('suki_user', JSON.stringify(data.user));
        window.location.href = data.redirect;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk Sekarang';
      }
    });
  </script>
</body>
</html>
