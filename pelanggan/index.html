<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUKI Laundry — Pelanggan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#1F2D30] sm:py-6 flex justify-center min-h-screen font-sans text-ink">

  <div class="w-full max-w-[430px] bg-canvas min-h-screen sm:min-h-[844px] sm:rounded-[36px] sm:shadow-2xl flex flex-col relative overflow-hidden">
    <!-- Konten halaman aktif dimuat ke sini -->
    <main id="app-view" class="flex-1 overflow-y-auto px-5 pt-7 pb-28"></main>

    <!-- Bottom Navigation -->
    <nav class="absolute bottom-0 inset-x-0 bg-white border-t border-mutedbox/60 px-3 pt-2 pb-4 grid grid-cols-5 gap-1">
      <a href="/pelanggan/beranda" data-route="beranda" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="home" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Beranda</span>
      </a>
      <a href="/pelanggan/lacak" data-route="lacak" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="map-pin" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Lacak</span>
      </a>
      <a href="/pelanggan/nota" data-route="nota" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="receipt" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Nota</span>
      </a>
      <a href="/pelanggan/bantuan" data-route="bantuan" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="message-circle" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Bantuan</span>
      </a>
      <a href="/pelanggan/profil" data-route="profil" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="user" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Profil</span>
      </a>
    </nav>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/pelanggan/router.js"></script>
</body>
</html>
