<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUKI Laundry — Pelanggan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#1F2D30] sm:py-6 flex justify-center min-h-screen font-sans text-ink">

  <div class="w-full max-w-[430px] bg-canvas min-h-screen sm:min-h-[844px] sm:rounded-[36px] sm:shadow-2xl flex flex-col relative overflow-hidden">
    <main id="app-view" class="flex-1 overflow-y-auto px-5 pt-7 pb-28"></main>

    <!-- Bottom Navigation -->
    <nav class="absolute bottom-0 inset-x-0 bg-white border-t border-mutedbox/60 px-3 pt-2 pb-4 grid grid-cols-5 gap-1">
      <a href="/pelanggan/beranda" data-route="beranda" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="home" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Beranda</span>
      </a>
      <a href="/pelanggan/lacak" data-route="lacak" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="map-pin" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Lacak</span>
      </a>
      <a href="/pelanggan/nota" data-route="nota" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="receipt" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Nota</span>
      </a>
      <a href="/pelanggan/bantuan" data-route="bantuan" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="message-circle" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Bantuan</span>
      </a>
      <a href="/pelanggan/profil" data-route="profil" class="nav-link flex flex-col items-center gap-1">
        <span class="nav-pill px-4 py-1 rounded-full"><i data-lucide="user" class="w-5 h-5"></i></span>
        <span class="nav-label text-[11px]">Profil</span>
      </a>
    </nav>

    <!-- MODAL KAMERA SCAN QR PENGAMBILAN -->
    <div id="scanModal" class="hidden absolute inset-0 z-50 bg-ink/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-4">
      <div class="bg-white rounded-3xl w-full p-5 space-y-4 shadow-2xl">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-base font-extrabold text-ink">Scan QR Pengambilan</h3>
            <p class="text-[11px] text-inksoft">Arahkan kamera ke QR di layar kasir SUKI Laundry.</p>
          </div>
          <button onclick="PelangganApp.closeScanner()" class="p-2 rounded-xl bg-canvas/60 text-ink cursor-pointer">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Viewfinder Kamera -->
        <div id="qrReader" class="w-full rounded-2xl overflow-hidden bg-ink/10 min-h-[240px]"></div>

        <div id="scanFeedback" class="hidden rounded-2xl px-4 py-3 text-xs font-semibold"></div>

        <!-- Fallback input manual bila menguji di perangkat tanpa kamera -->
        <div class="pt-2 border-t border-mutedbox/70 space-y-2">
          <div class="text-[11px] text-inksoft">Atau tempel kode QR manual (untuk uji tanpa kamera):</div>
          <div class="flex gap-2">
            <input id="manualQrInput" type="text" placeholder="SUKI-PICKUP|#SK-1048|XXXX"
              class="flex-1 px-3 py-2 rounded-xl border border-borderline text-xs focus:outline-none focus:border-tealbrand" />
            <button onclick="PelangganApp.submitManualQR()" class="px-3.5 py-2 rounded-xl bg-tealbrand text-white text-xs font-bold cursor-pointer">
              Cocokkan
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/pelanggan/router.js"></script>
</body>
</html>
