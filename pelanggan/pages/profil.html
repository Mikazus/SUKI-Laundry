<section class="space-y-4">
  <div>
    <h1 class="text-[28px] font-extrabold tracking-tight">Profil saya</h1>
    <p class="text-sm text-inksoft">Atur akun dan kabar cucianmu.</p>
  </div>

  <div class="bg-aqua rounded-3xl p-5 shadow-sm">
    <div id="profName" class="text-xl font-extrabold text-ink"></div>
    <div id="profSub" class="text-sm text-ink/80 mt-1"></div>
    <div id="profEmail" class="text-xs font-semibold text-ink mt-1"></div>
  </div>

  <div class="bg-white rounded-3xl p-5 shadow-sm">
    <label class="block text-sm font-bold text-ink mb-2">Nomor WhatsApp</label>
    <div class="flex items-center border border-borderline rounded-2xl px-3.5 py-2.5">
      <input id="profPhone" type="text" class="flex-1 text-sm text-ink bg-transparent focus:outline-none" />
      <button onclick="PelangganApp.saveProfile()" class="text-sm font-bold text-ink hover:text-tealbrand ml-2 cursor-pointer">Ubah</button>
    </div>
    <p id="profMsg" class="text-xs text-inksoft mt-2">Kabar cucian dikirim ke nomor ini.</p>
  </div>

  <div>
    <h2 class="text-lg font-bold text-ink mb-2.5">Notifikasi</h2>
    <div class="bg-white rounded-3xl p-5 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm font-bold text-ink">Notifikasi cucian selesai</div>
          <div class="text-xs text-inksoft">Saat cucian siap diambil.</div>
        </div>
        <button id="toggleEnd" onclick="PelangganApp.toggleNotif('end')" class="w-12 h-7 rounded-full p-1 transition flex cursor-pointer">
          <span class="w-5 h-5 rounded-full bg-white shadow"></span>
        </button>
      </div>
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm font-bold text-ink">Notifikasi status berubah</div>
          <div class="text-xs text-inksoft">Setiap tahap pengerjaan.</div>
        </div>
        <button id="toggleChg" onclick="PelangganApp.toggleNotif('chg')" class="w-12 h-7 rounded-full p-1 transition flex cursor-pointer">
          <span class="w-5 h-5 rounded-full bg-white shadow"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="bg-aqua rounded-3xl p-4 shadow-sm">
    <div class="text-sm font-bold text-ink">Tenang, nomormu aman.</div>
    <div class="text-xs text-ink/80 mt-0.5">Hanya untuk informasi pesanan SUKI Laundry.</div>
  </div>

  <button onclick="SukiAPI.logout()" class="w-full py-3.5 rounded-2xl bg-white border border-borderline text-ink font-bold text-sm hover:bg-mutedbox/40 transition cursor-pointer">
    Keluar dari akun
  </button>
</section>
