<section class="space-y-4">
  <div>
    <h1 class="text-[28px] font-extrabold tracking-tight">Nota digital</h1>
    <p class="text-sm text-inksoft">Rapi tersimpan, mudah diambil.</p>
  </div>

  <div class="bg-white p-1.5 rounded-2xl grid grid-cols-2 gap-1 shadow-sm">
    <button id="segNota" onclick="PelangganApp.setNotaMode('nota')" class="py-2.5 rounded-xl bg-tealbrand text-white font-bold text-sm transition cursor-pointer">Nota</button>
    <button id="segRiwayat" onclick="PelangganApp.setNotaMode('riwayat')" class="py-2.5 rounded-xl text-ink font-semibold text-sm transition cursor-pointer">Riwayat</button>
  </div>

  <!-- Tombol Buka Kamera Scan QR Owner -->
  <button onclick="PelangganApp.openScanner()" class="w-full py-3.5 px-4 rounded-2xl bg-tealbrand hover:bg-tealdark text-white font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition cursor-pointer">
    <i data-lucide="scan-line" class="w-5 h-5"></i>
    <span>Scan QR Pengambilan (Buka Kamera)</span>
  </button>

  <div id="notaActiveContainer"></div>

  <div>
    <div class="flex items-center justify-between mb-3 mt-2">
      <h2 class="text-lg font-bold text-ink">Riwayat terbaru</h2>
      <span id="historyCount" class="text-xs text-inksoft"></span>
    </div>
    <div id="notaHistoryList" class="space-y-3"></div>
  </div>
</section>
